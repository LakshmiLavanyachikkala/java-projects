<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<style>
    .mydiv{
        text-align: center;
        background-color: bisque;
          }
          span{
            color:red;
          }
</style>
<body>
<div class="mydiv">
    <h2>Registration Form</h2>

    <form>
        <label>Name:<span>*</span></label><br><br>
        <input type="text" id="name" name="name"><br><br>

        <label >Email ID:<span>*</span></label><br><br>
        <input type="email" id="email" name="email"><br><br>

        <label >Phone Number:<span>*</span></label><br><br>
        <input type="number" id="number" name="phone"><br><br>

        <label>Password:<span>*</span></label><br><br>
        <input type="password" id="password" name="password"><br><br>

        <label>Confirm Password:<span>*</span></label><br><br>
        <input type="password" id="confirm_password" name="confirm password" ><br><br>

        <input type="submit" name="submit"  value="Register"><br><br>
    </form>

    <br>
    <p>Already Registered &nbsp<a href="#">Click here</a></p>
</div>
</body>
</html>
