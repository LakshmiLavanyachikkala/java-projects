<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
        .myDiv{
            background-image :linear-gradient(rgba(255, 0, 0, 0.34),rgba(0, 128, 0, 0.351)), url("./spaceImage.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            border: 2px solid black;
            width: 100%;
            height:60%;
            position: relative;

        }
        .myPara{
            color: rgb(230, 208, 10);
            font-size: larger;
            font-style: italic;
            position: absolute;
            border-radius:3px;
            border-bottom-right-radius: 40%;
            right: 10%;
        }
         
    </style>
    <body>
       <div class ="myDiv">
        <p class ="myPara"> INDIA -SPACE STATION</p>

       </div>
    </body>
    </html>
</html>
